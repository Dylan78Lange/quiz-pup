<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Pup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="spotlight left"></div>
    <div class="spotlight right"></div>

    <h1 id="title">QUIZ PUP</h1>

    <div id="hud">
      <div id="lives"></div>
      <div id="level-name"></div>
      <div id="bank"><span class="coin">Q</span> <span id="bank-num">0</span></div>
    </div>

    <div id="host">
      <div id="host-face">🕺<span id="mic">🎤</span></div>
      <div id="host-says">Welcome to Quiz Pup!</div>
    </div>

    <div id="progress"></div>
    <div id="pot"></div>

    <div id="question-box">
      <div id="theme"></div>
      <div id="question"></div>
    </div>

    <div id="answers"></div>

    <div id="floor">
      <div id="effect"></div>
      <div id="pup-row">
        <span id="toys"></span>
        <div id="dog"><span id="hat"></span>🐶</div>
      </div>
      <div id="dog-name">Biscuit</div>
      <div id="tricks"></div>
    </div>

    <button id="next" class="big-button hidden">Next question ▶</button>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <h1 class="overlay-title">QUIZ PUP</h1>
      <div class="overlay-dog">🐶</div>
      <p>The quiz show where your pup is the star!</p>
      <button id="start" class="big-button">★ START THE SHOW ★</button>
      <button id="show-scores" class="big-button quit">🏆 Top Scores</button>
    </div>

    <!-- Top Score Board -->
    <div id="scores-screen" class="overlay hidden">
      <h1 class="overlay-title small">TOP SCORES</h1>
      <ol id="scores-list"></ol>
      <button id="scores-play" class="big-button">Let's play! ▶</button>
    </div>

    <!-- Pick a theme screen -->
    <div id="theme-screen" class="overlay hidden">
      <h1 class="overlay-title small">PICK A THEME!</h1>
      <p id="theme-level"></p>
      <div id="theme-buttons"></div>
    </div>

    <!-- End of level screen -->
    <div id="end-screen" class="overlay hidden">
      <h1 id="end-title" class="overlay-title"></h1>
      <div id="end-stars"></div>
      <p id="end-text"></p>
      <div id="end-coins"><span class="coin big">Q</span> <span id="end-coins-num">0</span></div>
      <div id="save-score" class="hidden">
        <p>Type your initials for the Top Score Board!</p>
        <input id="initials" maxlength="3" placeholder="AAA" autocomplete="off" spellcheck="false">
        <button id="save-btn" class="big-button">Save 🏆</button>
      </div>
      <div class="end-buttons">
        <button id="end-main" class="big-button"></button>
        <button id="end-shop" class="big-button shop">🛒 Pup Shop</button>
        <button id="end-quit" class="big-button quit">Quit &amp; keep my coins</button>
      </div>
    </div>

    <!-- Pup Shop (opens on top of the end screen) -->
    <div id="shop-screen" class="overlay hidden">
      <h1 class="overlay-title small">PUP SHOP</h1>
      <div id="shop-top">
        <div id="shop-dog"><span id="shop-hat"></span>🐶</div>
        <div>Your coins: <span class="coin">Q</span> <span id="shop-coins">0</span></div>
      </div>
      <p id="shop-says"></p>
      <div id="shop-items"></div>
      <button id="shop-close" class="big-button">Back to the show ▶</button>
    </div>
  </div>

  <script src="questions/themes.js"></script>
  <script src="questions/geography.js"></script>
  <script src="questions/video-games.js"></script>
  <script src="questions/kids-movies.js"></script>
  <script src="questions/food.js"></script>
  <script src="questions/brand-icons.js"></script>
  <script src="questions/famous-people.js"></script>
  <script src="game.js"></script>
  <script src="shop.js"></script>
</body>
</html>

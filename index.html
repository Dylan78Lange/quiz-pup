<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Pup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <h1 id="title">QUIZ PUP</h1>

    <div id="host">
      <div id="host-face">🕺</div>
      <div id="host-says">Welcome to Quiz Pup!</div>
    </div>

    <div id="question-box">
      <div id="theme"></div>
      <div id="question"></div>
    </div>

    <div id="answers"></div>

    <div id="dog-area">
      <div id="dog">🐶</div>
      <div id="dog-name">Biscuit</div>
    </div>

    <button id="next" class="hidden">Next question ▶</button>
  </div>

  <script src="questions.js"></script>
  <script src="game.js"></script>
</body>
</html>

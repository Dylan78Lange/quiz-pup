<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Pup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="spotlight left"></div>
    <div class="spotlight right"></div>

    <div id="sound-buttons">
      <button id="toggle-music" title="Music">🎵</button>
      <button id="toggle-sound" title="Sound effects">🔊</button>
    </div>

    <h1 id="title">QUIZ PUP</h1>

    <div id="hud">
      <div id="lives"></div>
      <div id="level-name"></div>
      <div id="bank"><span class="coin">Q</span> <span id="bank-num">0</span></div>
    </div>

    <div id="host">
      <div id="host-face">🕺<span id="mic">🎤</span></div>
      <div id="host-says">Welcome to Quiz Pup!</div>
    </div>

    <div id="progress"></div>
    <div id="pot"></div>

    <div id="question-box">
      <div id="theme"></div>
      <div id="logo-card" class="hidden"><div id="logo"></div></div>
      <div id="question"></div>
    </div>

    <div id="answers"></div>

    <div id="floor">
      <div id="effect"></div>
      <div id="pup-row">
        <span id="toys"></span>
        <div id="dog" class="pup"></div>
      </div>
      <div id="dog-name"></div>
      <div id="tricks"></div>
    </div>

    <div class="end-buttons">
      <button id="next" class="big-button hidden">Next question ▶</button>
      <button id="pass" class="big-button quit hidden">Pass ➜ next player</button>
    </div>

    <div id="players-strip"></div>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <h1 class="overlay-title">QUIZ PUP</h1>
      <div class="overlay-dog" id="start-dog"></div>
      <p>The quiz show where your pup is the star!</p>
      <div id="host-picker">
        <div class="host-picker-label">Pick your host:</div>
        <div id="host-buttons"></div>
      </div>
      <button id="start" class="big-button">★ START THE SHOW ★</button>
      <button id="show-scores" class="big-button quit">🏆 Top Scores</button>
    </div>

    <!-- Setup: how many players, then each player's name and pup -->
    <div id="setup-screen" class="overlay hidden">
      <div id="setup-count">
        <h1 class="overlay-title small">HOW MANY PLAYERS?</h1>
        <div id="count-buttons">
          <button class="big-button count-button" data-count="1">1</button>
          <button class="big-button count-button" data-count="2">2</button>
          <button class="big-button count-button" data-count="3">3</button>
          <button class="big-button count-button" data-count="4">4</button>
        </div>
      </div>
      <div id="setup-player" class="hidden">
        <h1 id="setup-title" class="overlay-title small">PLAYER 1</h1>
        <div class="setup-fields">
          <label>Your name
            <span class="name-row">
              <input id="player-name" maxlength="8" autocomplete="off" spellcheck="false">
              <button type="button" id="roll-player" class="dice-button" title="Pick a random name">🎲</button>
            </span>
          </label>
          <label>Your pup's name
            <span class="name-row">
              <input id="pup-name" maxlength="14" autocomplete="off" spellcheck="false">
              <button type="button" id="roll-pup" class="dice-button" title="Pick a random pup name">🎲</button>
            </span>
          </label>
        </div>
        <p>Pick your pup:</p>
        <div id="breed-buttons"></div>
        <button id="setup-next" class="big-button">Next ▶</button>
      </div>
    </div>

    <!-- Whose turn is it? -->
    <div id="turn-screen" class="overlay hidden">
      <div id="turn-dog" class="pup"></div>
      <h1 id="turn-title" class="overlay-title small"></h1>
      <p id="turn-text"></p>
      <button id="turn-go" class="big-button">I'm ready! ▶</button>
    </div>

    <!-- Pick a theme screen -->
    <div id="theme-screen" class="overlay hidden">
      <h1 class="overlay-title small">PICK A THEME!</h1>
      <p id="theme-level"></p>
      <div id="theme-buttons"></div>
    </div>

    <!-- End of level screen -->
    <div id="end-screen" class="overlay hidden">
      <h1 id="end-title" class="overlay-title"></h1>
      <div id="end-stars"></div>
      <p id="end-text"></p>
      <div id="end-coins"><span class="coin big">Q</span> <span id="end-coins-num">0</span></div>
      <div class="end-buttons">
        <button id="end-main" class="big-button"></button>
        <button id="end-shop" class="big-button shop">🛒 Pup Shop</button>
        <button id="end-quit" class="big-button quit">Quit &amp; keep my coins</button>
      </div>
    </div>

    <!-- Final results -->
    <div id="final-screen" class="overlay hidden">
      <h1 id="final-title" class="overlay-title small">FINAL SCORES</h1>
      <ol id="final-list"></ol>
      <p>Scores saved to the Top Score Board! 🏆</p>
      <div class="end-buttons">
        <button id="final-scores" class="big-button quit">🏆 Top Scores</button>
        <button id="final-again" class="big-button">Play again ↺</button>
      </div>
    </div>

    <!-- Top Score Board -->
    <div id="scores-screen" class="overlay hidden">
      <h1 class="overlay-title small">TOP SCORES</h1>
      <ol id="scores-list"></ol>
      <button id="scores-play" class="big-button">Let's play! ▶</button>
    </div>

    <!-- Pup Shop (opens on top of the end screen) -->
    <div id="shop-screen" class="overlay hidden">
      <h1 class="overlay-title small">PUP SHOP</h1>
      <div id="shop-top">
        <div id="shop-dog" class="pup"></div>
        <div id="shop-wallet">
          <div class="wallet-label">COINS TO SPEND</div>
          <div class="wallet-amount"><span class="coin big">Q</span> <span id="shop-coins">0</span></div>
        </div>
      </div>
      <p id="shop-says"></p>
      <div id="shop-items"></div>
      <button id="shop-close" class="big-button">Back to the show ▶</button>
    </div>
  </div>

  <script src="dogs.js"></script>
  <script src="sound.js"></script>
  <script src="logos.js"></script>
  <script src="questions/themes.js"></script>
  <script src="questions/geography.js"></script>
  <script src="questions/video-games.js"></script>
  <script src="questions/kids-movies.js"></script>
  <script src="questions/food.js"></script>
  <script src="questions/brand-icons.js"></script>
  <script src="questions/famous-people.js"></script>
  <script src="game.js"></script>
  <script src="shop.js"></script>
</body>
</html>
